<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="Landing.css" />
    <link rel="stylesheet" href="Header.css" />
    <link rel="stylesheet" href="Footer.css" />
  </head>
  <body>
    <header class="header">
      <nav class="header-nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="/Landing.html" class="nav-link">Inicio</a>
          </li>
          <li class="nav-item">
            <a href="/" class="nav-link">Servicio</a>
          </li>
          <li class="nav-item">
            <a href="/contacto.html" class="nav-link">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="section-container">
      <h1 class="main-heading">Contáctanos</h1>
      <p class="description">
        Estamos aquí para ayudarte. Por favor, completa el formulario o
        visítanos en nuestra ubicación.
      </p>

      <div class="map-container">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3797.036615167979!2d-92.92980912533822!3d17.883741383090552!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85edb0b330000001%3A0xb837aa5219c21cea!2sUniversidad%20Tecnol%C3%B3gica%20de%20Tabasco!5e0!3m2!1ses-419!2smx!4v1743581052655!5m2!1ses-419!2smx"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <form class="contact-form">
        <label for="name">Nombre:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Tu nombre"
          required
        />

        <label for="email">Correo electrónico:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Tu correo electrónico"
          required
        />

        <label for="message">Mensaje:</label>
        <textarea
          id="message"
          name="message"
          placeholder="Escribe tu mensaje aquí"
          required
        ></textarea>

        <button type="submit" class="cta-button">Enviar</button>
      </form>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-content">
          <div class="footer-brand">
            <a href="/landing" class="footer-logo">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/5/53/Wikimedia-logo.png"
                class="footer-logo-image"
                alt="logo"
              />
              <span class="footer-logo-text">Docucheck</span>
            </a>
            <p class="footer-description">Sube, corrige y brilla con IA.</p>
          </div>
          <div class="footer-links">
            <div class="footer-column">
              <h2 class="footer-heading">Legal</h2>
              <ul class="footer-list">
                <li class="footer-item">
                  <a href="/terminos-uso" class="footer-link"
                    >Términos de uso</a
                  >
                </li>
                <li class="footer-item">
                  <a href="/politica-privacidad" class="footer-link"
                    >Política de privacidad</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
